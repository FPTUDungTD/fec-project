spring.application.name=fec-backend
server.port=8080

# Kết nối PostgreSQL container
spring.datasource.url=jdbc:postgresql://localhost:5432/fec_db
spring.datasource.username=fec_admin
spring.datasource.password=adminpassword123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Kết nối Redis container
spring.data.redis.host=localhost
spring.data.redis.port=6379

