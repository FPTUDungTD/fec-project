services:
  postgres:
    image: postgres:16-alpine
    container_name: fec_postgres
    restart: always
    environment:
      POSTGRES_DB: fec_db
      POSTGRES_USER: fec_admin
      POSTGRES_PASSWORD: adminpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fec_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: